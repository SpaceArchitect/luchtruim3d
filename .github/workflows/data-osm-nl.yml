name: data-osm-nl
# Heel NL (reset-push, Christian 25 nov): OSM (ODbL) per tegel ophalen via Overpass, in de Action omzetten naar het compacte
# app-formaat (tools/build_landscape.py) en alleen dat bewaren op branch data/osm-nl. Ruwe data gaat niet in git (te groot). Raakt main/live niet.
on:
  push:
    branches: ['wip/**']
    paths: ['.github/workflows/data-osm-nl.yml']
  workflow_dispatch:
    inputs:
      tiles: {description: 'tegels (bv. nl-02 nl-12), leeg = alle', required: false, default: ''}
permissions:
  contents: write
jobs:
  tiles:
    runs-on: ubuntu-latest
    outputs: {list: '${{ steps.l.outputs.list }}'}
    steps:
      - uses: actions/checkout@v4
      - id: l
        run: |
          T="${{ github.event.inputs.tiles }}"
          if [ -n "$T" ]; then echo "list=$(python3 -c "import json,sys;print(json.dumps(sys.argv[1:]))" $T)" >> "$GITHUB_OUTPUT"
          else echo "list=$(python3 tools/fetch_osm.py --list)" >> "$GITHUB_OUTPUT"; fi
  tile:
    needs: tiles
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 1   # Overpass: één tegelijk (27 nov: met 2 tegelijk 7–21 keer 502 per tegel)
      matrix: {tile: '${{ fromJson(needs.tiles.outputs.list) }}'}
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q shapely
      - run: python3 tools/fetch_osm.py ${{ matrix.tile }}
      - name: Compact maken
        run: |
          BB=$(python3 -c "import json;m=json.load(open('osm/${{ matrix.tile }}/meta.json'));s,w,n,e=m['bbox'];print(f'{w},{s},{e},{n}')")
          mkdir -p out
          python3 tools/build_landscape.py --region ${{ matrix.tile }} --src osm/${{ matrix.tile }} --clip $BB --out out/${{ matrix.tile }}.json
          python3 -c "import json;m=json.load(open('osm/${{ matrix.tile }}/meta.json'));json.dump(m,open('out/${{ matrix.tile }}.meta.json','w'))"
          ls -la out osm/${{ matrix.tile }}
      - uses: actions/upload-artifact@v4
        with: {name: '${{ matrix.tile }}', path: out/}
  push:
    needs: tile
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {path: art}
      - name: Naar branch data/osm-nl (samenvoegen; een tegel met meer ontbrekende lagen vervangt nooit een betere)
        run: |
          mkdir -p osm-nl new && find art -name '*.json' -exec cp {} new/ \;
          if git fetch -q origin data/osm-nl; then git archive FETCH_HEAD osm-nl | tar -x; fi
          python3 - <<'PY'
          import glob, json, os, shutil
          for m in sorted(glob.glob('new/*.meta.json')):
              t = os.path.basename(m)[:-10]; nm = json.load(open(m)); old = f'osm-nl/{t}.meta.json'
              om = json.load(open(old)) if os.path.exists(old) else None
              nmiss = len(nm.get('missing', [])); omiss = len(om['missing']) if om and 'missing' in om else 99  # oude tegels zonder 'missing' = onbekend
              keep = nmiss > omiss
              print(t, 'nieuw ontbreekt', nm.get('missing', []), '| oud', om.get('missing', '?') if om else '-', '→', 'oud blijft' if keep else 'nieuw')
              if not keep:
                  shutil.copy(m, old); shutil.copy(f'new/{t}.json', f'osm-nl/{t}.json')
          bad = {os.path.basename(m)[:-10]: json.load(open(m)).get('missing', '?') for m in glob.glob('osm-nl/*.meta.json')}
          bad = {k: v for k, v in bad.items() if v}
          print('ontbrekend na samenvoegen:', bad or 'niets')
          open('osm-nl/MISSING.json', 'w').write(json.dumps(bad, indent=1, sort_keys=True))
          PY
          ls -la osm-nl
          git config user.name "luchtruim3d-bot"; git config user.email "bot@luchtruim3d.nl"
          git checkout --orphan data/osm-nl
          git rm -rq --cached . ; git add -f osm-nl
          git commit -qm "OSM heel NL compact $(date -u +%F)"
          git push -f origin HEAD:refs/heads/data/osm-nl
